# Persistent Render deploy for Siisti salin piha (SQLite on disk).
# Free tier has no persistent disk — use at least Starter.
services:
  - type: web
    name: siisti-salinpiha
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    disk:
      name: siisti-piha-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: JWT_SECRET
        generateValue: true
      - key: APP_PUBLIC_URL
        value: https://siisti-salinpiha.onrender.com
      - key: ADMIN_EMAIL
        value: jussiheim@gmail.com
      - key: ADMIN_NAME
        value: Jussi Heimonen
      - key: ADMIN_PASSWORD
        sync: false
      - key: JONI_EMAIL
        sync: false
      - key: JONI_NAME
        value: Joni Moilanen
      - key: JONI_PASSWORD
        sync: false
