<!doctype html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f3d2e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Salin piha" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Siisti salin piha — Pihavuorot ja pihanhoito" />
    <title>Siisti salin piha</title>
    <!--
      iOS home-screen PWA: 100dvh / innerHeight is often short (screen minus top inset),
      which leaves a white band under the tab bar. 100lvh/100vh is the real screen height.
      Measure before paint and expose --app-height for the shell CSS.
    -->
    <script>
      (function () {
        var ua = window.navigator
        var standalone =
          ua.standalone === true ||
          window.matchMedia('(display-mode: standalone)').matches ||
          window.matchMedia('(display-mode: fullscreen)').matches
        if (standalone) document.documentElement.classList.add('is-standalone')

        function pinScroll() {
          window.scrollTo(0, 0)
          document.documentElement.scrollTop = 0
          document.body.scrollTop = 0
          if (window.visualViewport && typeof window.visualViewport.offsetTop === 'number') {
            /* Keep layout viewport pinned even if visualViewport scrolled for the keyboard. */
            if (window.visualViewport.offsetTop !== 0) {
              try {
                window.scrollTo(0, 0)
              } catch (_) {}
            }
          }
        }

        function applyAppHeight() {
          var h = window.innerHeight || 0
          if (window.visualViewport && window.visualViewport.height) {
            /* Browser tabs: prefer the visible viewport (toolbars). */
            if (!standalone) h = Math.round(window.visualViewport.height) || h
          }
          var probe = document.createElement('div')
          probe.setAttribute('aria-hidden', 'true')
          /* Fixed + inset can inherit the lying viewport — measure with top/height only. */
          probe.style.cssText =
            'position:fixed;visibility:hidden;pointer-events:none;top:0;left:0;width:0;height:100vh;height:100lvh;'
          document.documentElement.appendChild(probe)
          var large = probe.offsetHeight || 0
          document.documentElement.removeChild(probe)
          if (standalone) {
            if (large > h) h = large
            /*
             * Last resort in standalone: screen.height is the physical CSS height.
             * Never use it in a Safari tab (toolbars make screen taller than visible).
             */
            if (window.screen && window.screen.height > h) h = window.screen.height
          }
          if (h > 0) document.documentElement.style.setProperty('--app-height', h + 'px')
          /* iOS keyboard/focus can scroll the document and hide the tab bar. */
          pinScroll()
        }

        applyAppHeight()
        window.addEventListener('resize', applyAppHeight)
        window.addEventListener('orientationchange', applyAppHeight)
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', applyAppHeight)
          window.visualViewport.addEventListener('scroll', pinScroll)
        }
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible') applyAppHeight()
        })
        /* After any form field / keyboard dismiss on any tab, snap shell back. */
        document.addEventListener('focusout', function () {
          window.setTimeout(applyAppHeight, 50)
          window.setTimeout(applyAppHeight, 300)
        })
        document.addEventListener(
          'focusin',
          function (e) {
            var t = e.target
            if (!t || !t.tagName) return
            var tag = String(t.tagName).toLowerCase()
            if (tag === 'input' || tag === 'textarea' || tag === 'select') pinScroll()
          },
          true,
        )
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
